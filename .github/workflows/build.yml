name: Lint & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax check
        run: node --check assets/admin.js

  release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $TAG" simple-google-indexing-api.php || { echo "Plugin header version != $TAG"; exit 1; }
          grep -q "'SGIA_VERSION', '$TAG'" simple-google-indexing-api.php || { echo "SGIA_VERSION != $TAG"; exit 1; }
      - name: Build installable zip
        run: |
          mkdir -p dist/simple-google-indexing-api
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude '.gitignore' --exclude 'README.md' ./ dist/simple-google-indexing-api/
          cd dist && zip -rq simple-google-indexing-api.zip simple-google-indexing-api
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/simple-google-indexing-api.zip
          generate_release_notes: true
